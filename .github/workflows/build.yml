name: Go

on:
  push:
    branches:
     - main
  pull_request:
    branches:
     - main

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore:') }}
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-go@v7
      with:
        go-version: 'stable'
    - uses: actions/checkout@v7
    - run: make
